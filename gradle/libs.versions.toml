[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
coreKtx = "1.13.1"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
roomRuntime = "2.6.1"
shizuku = "13.1.5"
firebaseBom = "33.5.1"
retrofitVersion = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.9.0"
