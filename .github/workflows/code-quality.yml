name: Code Quality Gate

# ── Triggers ──────────────────────────────────────────────────────────────────
# Runs on every PR and push to main / copilot branches, AND can be triggered
# manually from the Actions tab to audit any branch on demand.
on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_checks:
        description: "Run Android checks"
        required: false
        default: "true"
        type: boolean
      windows_checks:
        description: "Run Windows checks"
        required: false
        default: "true"
        type: boolean
      post_pr_comment:
        description: "Post summary comment on PR"
        required: false
        default: "true"
        type: boolean

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. ANDROID – compile check, lint, ktlint style, unit tests, detekt static analysis
  # ════════════════════════════════════════════════════════════════════════════
  android-quality:
    name: Android Quality Gate
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.android_checks == 'true'

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for change detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        working-directory: android
        run: chmod +x gradlew

      # ── Step 1: Compile (catches syntax / import errors) ───────────────────
      - name: Compile sources
        id: compile
        working-directory: android
        run: ./gradlew compileDebugKotlin --no-daemon 2>&1 | tee compile.log
        continue-on-error: true

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-log
          path: android/compile.log
          retention-days: 7

      # ── Step 2: Android Lint (XML report → annotations) ───────────────────
      - name: Android Lint
        id: lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log
        continue-on-error: true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          retention-days: 14

      # ── Step 3: ktlint (Kotlin code style) ────────────────────────────────
      - name: Install ktlint
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint"
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Run ktlint
        id: ktlint
        working-directory: android
        run: |
          ktlint --reporter=plain --reporter=checkstyle,output=build/ktlint-report.xml \
            "app/src/main/java/**/*.kt" \
            "app/src/test/java/**/*.kt" \
            2>&1 | tee ktlint.log
        continue-on-error: true

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ktlint-report
          path: android/build/ktlint-report.xml
          retention-days: 7

      # ── Step 4: Unit tests with coverage ──────────────────────────────────
      - name: Run unit tests
        id: tests
        working-directory: android
        run: |
          ./gradlew test --no-daemon \
            -PtestCoverageEnabled=true \
            2>&1 | tee test.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14

      # ── Step 5: Debug APK build (final gate) ──────────────────────────────
      - name: Assemble debug APK
        id: apk_build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee apk-build.log
        continue-on-error: true

      - name: Upload debug APK
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Collect step outcomes for the summary ─────────────────────────────
      - name: Generate Android quality summary
        if: always()
        id: android_summary
        run: |
          compile="${{ steps.compile.outcome }}"
          lint="${{ steps.lint.outcome }}"
          ktlint="${{ steps.ktlint.outcome }}"
          tests="${{ steps.tests.outcome }}"
          build="${{ steps.apk_build.outcome }}"

          summary="## Android Quality Gate\n"
          summary+="| Check | Result |\n|---|---|\n"
          summary+="| Compile | $([ "$compile" = "success" ] && echo "✅" || echo "❌") |\n"
          summary+="| Android Lint | $([ "$lint" = "success" ] && echo "✅" || echo "⚠️") |\n"
          summary+="| ktlint style | $([ "$ktlint" = "success" ] && echo "✅" || echo "⚠️") |\n"
          summary+="| Unit Tests | $([ "$tests" = "success" ] && echo "✅" || echo "❌") |\n"
          summary+="| Debug APK build | $([ "$build" = "success" ] && echo "✅" || echo "❌") |\n"

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          printf "%s" "$summary" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Fail the job if compile or apk build failed
          if [ "$compile" != "success" ] || [ "$build" != "success" ] || [ "$tests" != "success" ]; then
            echo "Critical Android check failed"
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # 2. WINDOWS – Roslyn build analysis, xUnit tests, coverage, publish check
  # ════════════════════════════════════════════════════════════════════════════
  windows-quality:
    name: Windows Quality Gate
    runs-on: windows-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.windows_checks == 'true'

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── Step 1: Restore packages ───────────────────────────────────────────
      - name: Restore NuGet packages
        id: restore
        working-directory: windows
        run: dotnet restore WscanPlus.sln
        continue-on-error: true

      # ── Step 2: Build with Roslyn warnings-as-errors (strict compile check) ─
      - name: Build – strict warnings
        id: build_strict
        working-directory: windows
        run: |
          dotnet build WscanPlus.sln -c Debug --no-restore `
            /p:TreatWarningsAsErrors=false `
            /p:WarningLevel=5 `
            /flp:logfile=build-warnings.log;verbosity=normal
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows/build-warnings.log
          retention-days: 7

      # ── Step 3: xUnit tests with coverage ─────────────────────────────────
      - name: Install coverlet global tool
        run: dotnet tool install --global coverlet.console
        continue-on-error: true

      - name: Run tests with coverage
        id: tests
        working-directory: windows
        run: |
          dotnet test WscanPlus.Tests/WscanPlus.Tests.csproj `
            -c Debug --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "console;verbosity=detailed" `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults/ `
            2>&1 | Tee-Object -FilePath test.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            windows/TestResults/
            windows/**/*.trx
          retention-days: 14

      # ── Step 4: Publish check (verifies whole app compiles to runnable binary) ─
      - name: Publish self-contained (release check)
        id: publish
        working-directory: windows/WscanPlus
        run: |
          dotnet publish WscanPlus.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o ../../dist/windows-quality-check `
            --no-restore `
            2>&1 | Tee-Object -FilePath publish.log
        continue-on-error: true

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish-log
          path: windows/WscanPlus/publish.log
          retention-days: 7

      # ── Step 5: Verify critical files are present in published output ──────
      - name: Verify published output
        id: verify
        if: steps.publish.outcome == 'success'
        run: |
          $missing = @()
          $required = @("WscanPlus.exe", "WscanPlus.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "dist/windows-quality-check/$f")) {
              $missing += $f
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing published files: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required published files present."
        continue-on-error: true

      # ── Collect outcomes ───────────────────────────────────────────────────
      - name: Generate Windows quality summary
        if: always()
        id: windows_summary
        shell: pwsh
        run: |
          $restore = "${{ steps.restore.outcome }}"
          $build   = "${{ steps.build_strict.outcome }}"
          $tests   = "${{ steps.tests.outcome }}"
          $publish = "${{ steps.publish.outcome }}"
          $verify  = "${{ steps.verify.outcome }}"

          $r = @{ success = "✅"; failure = "❌"; skipped = "⏭"; cancelled = "🚫" }

          $summary  = "## Windows Quality Gate`n"
          $summary += "| Check | Result |`n|---|---|`n"
          $summary += "| NuGet restore | $($r[$restore]) |`n"
          $summary += "| Build (WarningLevel 5) | $($r[$build]) |`n"
          $summary += "| xUnit Tests | $($r[$tests]) |`n"
          $summary += "| Publish check | $($r[$publish]) |`n"
          $summary += "| Published output verify | $($r[$verify]) |`n"

          "summary<<EOF" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          $summary | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($build -ne "success" -or $tests -ne "success" -or $publish -ne "success") {
            Write-Error "Critical Windows check failed"
            exit 1
          }

  # ════════════════════════════════════════════════════════════════════════════
  # 3. COMBINED SUMMARY – post a rich PR comment summarising all findings
  # ════════════════════════════════════════════════════════════════════════════
  post-summary:
    name: Post Quality Summary
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.post_pr_comment == 'true')
    needs: [android-quality, windows-quality]

    steps:
      - name: Build summary comment
        id: comment_body
        run: |
          android="${{ needs.android-quality.result }}"
          windows="${{ needs.windows-quality.result }}"

          icon_android=$([ "$android" = "success" ] && echo "✅" || echo "❌")
          icon_windows=$([ "$windows" = "success" ] && echo "✅" || echo "❌")

          body="## 🛡 wscan+ Code Quality Gate\n\n"
          body+="| Platform | Result |\n|---|---|\n"
          body+="| Android (compile + lint + ktlint + tests + APK) | $icon_android |\n"
          body+="| Windows (.NET build + xUnit + publish) | $icon_windows |\n\n"

          if [ "$android" != "success" ] || [ "$windows" != "success" ]; then
            body+="### ⚠ Issues found\n"
            body+="Check the **Actions** tab for detailed logs and uploaded artefacts.\n"
            body+="Download the relevant log artefact to see exact error lines.\n"
          else
            body+="### 🎉 All checks passed\n"
            body+="The build is healthy and all quality gates are green.\n"
          fi

          body+="\n---\n"
          body+="*Triggered by commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`.*"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          printf "%s" "$body" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '## 🛡 wscan+ Code Quality Gate';
            const body   = `${{ steps.comment_body.outputs.body }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ════════════════════════════════════════════════════════════════════════════
  # 4. BUILD-CONFIRMATION MARKER – uploaded only when ALL checks pass on main
  #    This asset is what UpdateChecker looks for before offering an update.
  # ════════════════════════════════════════════════════════════════════════════
  upload-build-confirmed:
    name: Upload build-confirmed marker
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      needs.android-quality.result == 'success' &&
      needs.windows-quality.result == 'success'
    needs: [android-quality, windows-quality]

    steps:
      - name: Create build-confirmed.txt
        run: |
          echo "Build confirmed on $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > build-confirmed.txt
          echo "Commit: ${{ github.sha }}" >> build-confirmed.txt
          echo "Run: ${{ github.run_id }}" >> build-confirmed.txt

      - name: Upload build-confirmed marker
        uses: actions/upload-artifact@v4
        with:
          name: build-confirmed
          path: build-confirmed.txt
          retention-days: 90
