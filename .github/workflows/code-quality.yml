name: Code Quality Gate

# ── Triggers ──────────────────────────────────────────────────────────────────
# Runs on every PR and push to main / copilot branches, AND can be triggered
# manually from the Actions tab to audit any branch on demand.
on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_checks:
        description: "Run Android checks"
        required: false
        default: true
        type: boolean

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` makes Actions run steps with `-eo pipefail`. Without it the
# default shell is `bash -e` (no pipefail), so `./gradlew … | tee x.log`
# always reports the exit status of `tee` and every check looks green.
defaults:
  run:
    shell: bash

permissions:
  contents: read

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. ANDROID – compile check, lint, ktlint style, unit tests, detekt static analysis
  # ════════════════════════════════════════════════════════════════════════════
  android-quality:
    name: Android Quality Gate
    runs-on: ubuntu-latest
    # inputs.* is typed: compare booleans to `true`, not the string 'true'.
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.android_checks == true

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for change detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # ── Step 1: Compile (catches syntax / import errors) ───────────────────
      - name: Compile sources
        id: compile
        run: ./gradlew compileDebugKotlin --no-daemon 2>&1 | tee compile.log
        continue-on-error: true

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-log
          path: compile.log
          retention-days: 7

      # ── Step 2: Android Lint (XML report → annotations) ───────────────────
      - name: Android Lint
        id: lint
        run: ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log
        continue-on-error: true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

      # ── Step 3: ktlint (Kotlin code style) ────────────────────────────────
      - name: Install ktlint
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint"
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Run ktlint
        id: ktlint
        run: |
          ktlint --reporter=plain --reporter=checkstyle,output=build/ktlint-report.xml \
            "app/src/main/java/**/*.kt" \
            "app/src/test/java/**/*.kt" \
            2>&1 | tee ktlint.log
        continue-on-error: true

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ktlint-report
          path: build/ktlint-report.xml
          retention-days: 7

      # ── Step 4: Unit tests with coverage ──────────────────────────────────
      - name: Run unit tests
        id: tests
        run: |
          ./gradlew test --no-daemon \
            -PtestCoverageEnabled=true \
            2>&1 | tee test.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      # ── Step 5: Debug APK build (final gate) ──────────────────────────────
      - name: Assemble debug APK
        id: apk_build
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee apk-build.log
        continue-on-error: true

      - name: Upload debug APK
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Collect step outcomes for the summary ─────────────────────────────
      - name: Generate Android quality summary
        if: always()
        id: android_summary
        run: |
          compile="${{ steps.compile.outcome }}"
          lint="${{ steps.lint.outcome }}"
          ktlint="${{ steps.ktlint.outcome }}"
          tests="${{ steps.tests.outcome }}"
          build="${{ steps.apk_build.outcome }}"

          summary="## Android Quality Gate\n"
          summary+="| Check | Result |\n|---|---|\n"
          summary+="| Compile | $([ "$compile" = "success" ] && echo "✅" || echo "❌") |\n"
          summary+="| Android Lint | $([ "$lint" = "success" ] && echo "✅" || echo "⚠️") |\n"
          summary+="| ktlint style | $([ "$ktlint" = "success" ] && echo "✅" || echo "⚠️") |\n"
          summary+="| Unit Tests | $([ "$tests" = "success" ] && echo "✅" || echo "❌") |\n"
          summary+="| Debug APK build | $([ "$build" = "success" ] && echo "✅" || echo "❌") |\n"

          # %b expands the \n escapes; the old "%s" into an unused output
          # wrote literal backslash-n and was never displayed anywhere.
          printf "%b" "$summary" >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if compile, tests or apk build failed
          if [ "$compile" != "success" ] || [ "$build" != "success" ] || [ "$tests" != "success" ]; then
            echo "Critical Android check failed"
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # 2. SUMMARY – post / update a PR comment with the gate result
  #    (The Windows gate was removed: this repo has no windows/ tree since the
  #    root-level refactor, so that job failed on every run.)
  # ════════════════════════════════════════════════════════════════════════════
  post-summary:
    name: Post Quality Summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [android-quality]
    permissions:
      pull-requests: write

    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        env:
          ANDROID_RESULT: ${{ needs.android-quality.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        with:
          # Values are read from env rather than spliced into the script with
          # ${{ }} — splicing broke on the backticks in the body and let the
          # branch name inject JavaScript.
          script: |
            const marker = '## 🛡 wscan+ Code Quality Gate';
            const ok = process.env.ANDROID_RESULT === 'success';
            let body = `${marker}\n\n`;
            body += '| Platform | Result |\n|---|---|\n';
            body += `| Android (compile + lint + ktlint + tests + APK) | ${ok ? '✅' : '❌'} |\n\n`;
            body += ok
              ? '### 🎉 All checks passed\nThe build is healthy and all quality gates are green.\n'
              : '### ⚠ Issues found\nCheck the **Actions** tab for detailed logs and uploaded artefacts.\n';
            body += `\n---\n*Triggered by commit \`${process.env.HEAD_SHA}\` on \`${process.env.HEAD_REF}\`.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ════════════════════════════════════════════════════════════════════════════
  # 3. BUILD-CONFIRMATION MARKER – uploaded only when ALL checks pass on main
  #    This asset is what UpdateChecker looks for before offering an update.
  # ════════════════════════════════════════════════════════════════════════════
  upload-build-confirmed:
    name: Upload build-confirmed marker
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      needs.android-quality.result == 'success'
    needs: [android-quality]

    steps:
      - name: Create build-confirmed.txt
        run: |
          echo "Build confirmed on $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > build-confirmed.txt
          echo "Commit: ${{ github.sha }}" >> build-confirmed.txt
          echo "Run: ${{ github.run_id }}" >> build-confirmed.txt

      - name: Upload build-confirmed marker
        uses: actions/upload-artifact@v4
        with:
          name: build-confirmed
          path: build-confirmed.txt
          retention-days: 90
