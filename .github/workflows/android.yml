name: Android CI

on:
  push:
    branches: [main, "copilot/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    name: Build & Test (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # Point Gradle at the pre-installed Android SDK so nothing needs
      # to be re-downloaded from dl.google.com at build time.
      - name: Configure Android SDK location
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "Using Android SDK at: $SDK_DIR"

      # Accept all SDK licenses so the build doesn't stall waiting for input.
      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$SDK_DIR/tools/bin/sdkmanager"                --licenses 2>/dev/null || \
          echo "License acceptance skipped (sdkmanager not found or licenses already accepted)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wscanplus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release-build:
    name: Assemble release APK (signed)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    env:
      # Expose whether the keystore secret is configured so steps can use
      # env.HAS_KEYSTORE in their if: conditions (secrets.* is not allowed in if:).
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK location
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$SDK_DIR/tools/bin/sdkmanager"                --licenses 2>/dev/null || \
          echo "License acceptance skipped (sdkmanager not found or licenses already accepted)"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > wscanplus-release.jks

      - name: Write keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        # Secrets come in via env and are written with printf so characters
        # like $ or ` in a password are not expanded by the shell.
        run: |
          {
            echo "storeFile=wscanplus-release.jks"
            printf 'storePassword=%s\n' "$KS_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KS_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KS_KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wscanplus-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
