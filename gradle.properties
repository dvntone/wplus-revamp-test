android.useAndroidX=true

# Increase JVM heap to prevent OutOfMemoryError during D8 dexing on CI.
# GitHub Actions ubuntu-latest runners provide ~7 GB RAM; 2 GB for Gradle
# leaves plenty of headroom for the OS and other tools.
# Ref: https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Suppress the "AGP tested up to compileSdk=34" warning when using compileSdk=35.
# AGP 8.7+ supports compileSdk=35 natively; upgrade AGP to remove this entirely.
android.suppressUnsupportedCompileSdk=35
